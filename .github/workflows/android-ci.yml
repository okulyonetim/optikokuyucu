name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # İmza anahtarı artık GitHub secret'larından gelir (önbellek 7 gün sonra silindiği için
      # anahtar değişiyor, Android da güncellemeyi "paket çakışıyor" diye reddediyordu).
      # Gerekli secret'lar: OPTIK_KEYSTORE_BASE64 ve OPTIK_KEYSTORE_PASSWORD.
      - name: Prepare permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPTIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPTIK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/optik-signing.p12"
            echo "OPTIK_KEYSTORE_PATH=$RUNNER_TEMP/optik-signing.p12" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PRESENT=true" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::OPTIK_KEYSTORE_BASE64 ve OPTIK_KEYSTORE_PASSWORD secret'ları tanımlı değil. Rastgele anahtarla imzalı APK yayımlanmasın diye derleme durduruldu."
            exit 1
          else
            echo "::warning::İmza anahtarı yok; varsayılan debug anahtarı kullanılacak. Bu APK yayımlanmaz."
          fi

      - name: Set up current Android command-line tools
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/android-commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-commandline-tools"
          mv "$RUNNER_TEMP/android-commandline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run OMR unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        env:
          OPTIK_KEYSTORE_PASSWORD: ${{ secrets.OPTIK_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      # Sabit anahtarın sertifika parmak izi (gizli değildir). APK başka bir anahtarla imzalanırsa
      # derleme durur; böylece telefonlara güncellenemeyen bir sürüm yayımlanamaz.
      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: 6a85ccad36bf533b23b738c5de9a0748820592a37172cb972c2dd64b8e056c84
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "APK sertifika SHA-256: $ACTUAL"
          if [ "${SIGNING_KEY_PRESENT:-}" = "true" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK beklenen anahtarla imzalanmamış. Beklenen: $EXPECTED_CERT_SHA256"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: optik-okuyucu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
