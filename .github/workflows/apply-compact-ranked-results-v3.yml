name: Apply compact ranked results v3

on:
  push:
    branches:
      - fix/compact-ranked-results-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-ranked-results-v3
      - name: Apply patch
        run: python3 .github/scripts/patch_compact_results.py
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/okulyonetim/optikokuyucu/ui/ExamDetailScreen.kt app/build.gradle.kts
          git commit -m "style: compact ranked result score and net [compact-patched]"
          git push origin HEAD:fix/compact-ranked-results-v3
