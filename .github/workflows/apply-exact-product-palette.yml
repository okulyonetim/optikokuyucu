name: Apply exact product palette
on:
  push:
    branches: [revert/theme-camera-refresh]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[palette-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/theme-camera-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_exact_product_palette.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/okulyonetim/optikokuyucu/ui/ProductUi.kt
          git rm .github/scripts/apply_exact_product_palette.py .github/workflows/apply-exact-product-palette.yml
          git commit -m "style: apply exact indigo amber cyan palette [palette-applied]"
          git push
