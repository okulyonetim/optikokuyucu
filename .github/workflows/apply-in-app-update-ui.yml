name: Apply in-app updater UI patch

on:
  push:
    branches:
      - feat/in-app-update

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/in-app-update
          fetch-depth: 0
      - name: Add updater card to settings once
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[updater-ui-applied\]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/okulyonetim/optikokuyucu/ui/OmrRootScreen.kt')
          text = path.read_text()
          old = '            item { SettingsSubjectsCard(settingsRepository) }\n'
          new = old + '            item { AppUpdateSettingsCard() }\n'
          if 'item { AppUpdateSettingsCard() }' not in text:
              if old not in text:
                  raise SystemExit('SettingsSubjectsCard insertion point not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/okulyonetim/optikokuyucu/ui/OmrRootScreen.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: show in-app updater in settings [updater-ui-applied]'
          git push origin HEAD:feat/in-app-update
