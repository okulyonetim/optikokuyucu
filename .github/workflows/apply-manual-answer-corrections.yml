  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/manual-answer-corrections
          fetch-depth: 0
      - name: Skip after patch already applied
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[manual-answer-applied\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Expected at least {count} matches in {path}, found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

