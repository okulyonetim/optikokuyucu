name: Apply manual answer corrections

on:
  push:
    branches:
      - feat/manual-answer-corrections

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/manual-answer-corrections
          fetch-depth: 0
      - name: Apply patch once
        run: |
          if git log -1 --pretty=%B | grep -q '\[manual-answer-applied\]'; then exit 0; fi
          python3 .github/scripts/apply_manual_answer_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/okulyonetim/optikokuyucu/omr/results/ScanRecordRepository.kt app/src/main/java/com/okulyonetim/optikokuyucu/ui/StudentPaperDetailScreen.kt app/src/test/java/com/okulyonetim/optikokuyucu/omr/results/ManualAnswerOverrideApplierTest.kt app/build.gradle.kts
          git commit -m "feat: allow manual student answer corrections [manual-answer-applied]"
          git push origin HEAD:feat/manual-answer-corrections
