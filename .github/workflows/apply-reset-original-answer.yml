name: Apply reset original answer

on:
  push:
    branches:
      - feat/reset-original-answer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/reset-original-answer
          fetch-depth: 0
      - name: Apply patch once
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[reset-original-applied\]'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/okulyonetim/optikokuyucu/ui/StudentPaperDetailScreen.kt')
          text = p.read_text()

          old = '''    fun setManualAnswer(questionId: String, selectedChoice: String?) {\n        runCatching {\n            scanRepository.setManualAnswer(scanRecordId, questionId, selectedChoice)\n        }.onSuccess {\n            answerRevision++\n            status = if (selectedChoice == null) {\n                "${questionDisplayNumber(questionId)}. soru manuel olarak boş yapıldı."\n            } else {\n                "${questionDisplayNumber(questionId)}. soru manuel olarak $selectedChoice işaretlendi."\n            }\n        }.onFailure { error ->\n            status = "Cevap düzeltilemedi: ${error.message ?: error.javaClass.simpleName}"\n        }\n    }\n'''
          new = old + '''\n    fun restoreOriginalAnswer(questionId: String) {\n        runCatching {\n            scanRepository.clearManualAnswer(scanRecordId, questionId)\n        }.onSuccess {\n            answerRevision++\n            status = "${questionDisplayNumber(questionId)}. soru taramadaki orijinal cevaba döndürüldü."\n        }.onFailure { error ->\n            status = "Orijinal cevaba dönülemedi: ${error.message ?: error.javaClass.simpleName}"\n        }\n    }\n'''
          if old not in text:
              raise SystemExit('setManualAnswer block not found')
          text = text.replace(old, new, 1)

          old = '''                            QuestionAnswerRow(\n                                answer = answer,\n                                evaluation = evaluations[answer.questionId],\n                                manuallyEdited = scanRepository.isManuallyCorrected(scanRecordId, answer.questionId),\n                                onChoiceClick = { choice ->\n                                    setManualAnswer(\n                                        answer.questionId,\n                                        if (answer.selectedChoice == choice) null else choice\n                                    )\n                                }\n                            )\n'''
          new = '''                            QuestionAnswerRow(\n                                answer = answer,\n                                evaluation = evaluations[answer.questionId],\n                                manuallyEdited = scanRepository.isManuallyCorrected(scanRecordId, answer.questionId),\n                                onChoiceClick = { choice ->\n                                    setManualAnswer(\n                                        answer.questionId,\n                                        if (answer.selectedChoice == choice) null else choice\n                                    )\n                                },\n                                onRestoreOriginal = { restoreOriginalAnswer(answer.questionId) }\n                            )\n'''
          if old not in text:
              raise SystemExit('QuestionAnswerRow call block not found')
          text = text.replace(old, new, 1)

          old = '''private fun QuestionAnswerRow(\n    answer: RecordedAnswer,\n    evaluation: QuestionEvaluation?,\n    manuallyEdited: Boolean,\n    onChoiceClick: (String) -> Unit\n) {\n'''
          new = '''private fun QuestionAnswerRow(\n    answer: RecordedAnswer,\n    evaluation: QuestionEvaluation?,\n    manuallyEdited: Boolean,\n    onChoiceClick: (String) -> Unit,\n    onRestoreOriginal: () -> Unit\n) {\n'''
          if old not in text:
              raise SystemExit('QuestionAnswerRow signature not found')
          text = text.replace(old, new, 1)

          old = '''        Spacer(Modifier.weight(1f))\n        Text(questionStateLabel(answer, evaluation) + if (manuallyEdited) " · Manuel" else "", style = MaterialTheme.typography.labelSmall, color = stateColor)\n    }\n}\n'''
          new = '''        Spacer(Modifier.weight(1f))\n        if (manuallyEdited) {\n            TextButton(\n                onClick = onRestoreOriginal,\n                contentPadding = androidx.compose.foundation.layout.PaddingValues(horizontal = 8.dp, vertical = 0.dp)\n            ) {\n                Text(\n                    "Orijinale dön",\n                    color = MaterialTheme.colorScheme.primary,\n                    fontSize = 11.sp,\n                    fontWeight = FontWeight.SemiBold\n                )\n            }\n        } else {\n            Text(\n                questionStateLabel(answer, evaluation),\n                style = MaterialTheme.typography.labelSmall,\n                color = stateColor\n            )\n        }\n    }\n}\n'''
          if old not in text:
              raise SystemExit('QuestionAnswerRow status block not found')
          text = text.replace(old, new, 1)

          old = '''                    status.startsWith("Cevap düzeltilemedi")\n'''
          new = '''                    status.startsWith("Cevap düzeltilemedi") ||\n                    status.startsWith("Orijinal cevaba dönülemedi")\n'''
          if old not in text:
              raise SystemExit('status error condition not found')
          text = text.replace(old, new, 1)

          p.write_text(text)

          g = Path('app/build.gradle.kts')
          gradle = g.read_text()
          gradle = gradle.replace('versionCode = 124', 'versionCode = 125', 1)
          gradle = gradle.replace('versionName = "0.19.68"', 'versionName = "0.19.69"', 1)
          g.write_text(gradle)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/okulyonetim/optikokuyucu/ui/StudentPaperDetailScreen.kt app/build.gradle.kts
          git commit -m 'feat: restore manually edited answer to original scan [reset-original-applied]'
          git push origin HEAD:feat/reset-original-answer
