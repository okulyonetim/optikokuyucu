name: Apply score sort and readable results

on:
  push:
    branches:
      - fix/score-sort-readable-results

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/score-sort-readable-results
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_score_sort_readable_results.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-score-sort-readable-results.yml
          rm -f tools/apply_score_sort_readable_results.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rank exam papers and clarify scoring UI [score-ui-applied]"
          git push origin HEAD:fix/score-sort-readable-results
