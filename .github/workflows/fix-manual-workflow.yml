name: Fix manual patch workflow

on:
  push:
    branches:
      - feat/manual-answer-corrections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/manual-answer-corrections
          fetch-depth: 0
      - name: Remove problematic condition
        run: |
          sed -i '/^[[:space:]]*if:.*manual-answer-applied/d' .github/workflows/apply-manual-answer-corrections.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-manual-answer-corrections.yml
          git commit -m "chore: fix manual answer workflow condition"
          git push origin HEAD:feat/manual-answer-corrections
