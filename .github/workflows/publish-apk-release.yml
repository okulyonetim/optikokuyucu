name: Publish APK Release

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-apk-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calculate tested app version
        id: version
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          VERSION_CODE=$((100000 + BUILD_NUMBER))
          VERSION_NAME="0.20.${BUILD_NUMBER}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Download tested APK artifact
        uses: actions/download-artifact@v5
        with:
          name: optik-okuyucu-debug-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Prepare APK
        shell: bash
        run: |
          test -f dist/app-debug.apk
          # Sabit dosya adı: https://github.com/okulyonetim/optikokuyucu/releases/latest/download/optik-okuyucu.apk
          # adresi her zaman en son sürümü indirir (sürüm numarası etiket ve başlıktadır).
          mv dist/app-debug.apk dist/optik-okuyucu.apk

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          APK="dist/optik-okuyucu.apk"
          CHECKSUM="$(sha256sum "$APK" | cut -d' ' -f1)"
          # Uygulama bu satırı okuyup indirilen dosyanın bozulmadığını doğrular.
          printf '%s\n\n%s\n\nSHA-256: %s\n' \
            "Optik Okuyucu ${VERSION_NAME} (versionCode ${VERSION_CODE})" \
            "Android CI testleri ve APK derlemesi başarıyla tamamlandıktan sonra otomatik yayımlandı." \
            "$CHECKSUM" > release-notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release-notes.txt
          else
            gh release create "$TAG" "$APK" \
              --target "$TARGET_SHA" \
              --title "Optik Okuyucu ${VERSION_NAME}" \
              --notes-file release-notes.txt \
              --latest
          fi
