name: Reduce rainbow theme
on:
  push:
    branches: [style/reduce-rainbow-pink]
    paths:
      - '.github/scripts/reduce_rainbow_theme.py'
      - '.github/workflows/reduce-rainbow-theme.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/reduce-rainbow-pink
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply balanced theme patch
        run: python .github/scripts/reduce_rainbow_theme.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/okulyonetim/optikokuyucu/ui/ProductUi.kt app/build.gradle.kts
          git commit -m 'style: reduce pink and rainbow accents' || exit 0
          git push origin HEAD:style/reduce-rainbow-pink
